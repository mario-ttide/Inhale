## Where Inhale's tools send things, and the pages they link to: the one place to edit when a service moves.
# Read by nx2/addresses.py (address(key)). A key left out or empty turns that use off: nothing is sent, and what was
# waiting stays for next time.
# (inhale) Every key is empty here: the services are upstream's, and a crash or a performance summary of this fork is not
# upstream's to receive. This fork has no such service; upstream's values are in its own file of this name.
[addresses]
# Inhale-api's telemetry (/telemetry/crash): POST a crash report (the crash window's Report automatically), kept where only the team reads it
crash_reports =
# Inhale-api's telemetry (/telemetry/perf): POST a performance summary (the launcher's Send performance statistics)
perf_reports =
